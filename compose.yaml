services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ums
      POSTGRES_USER: ums
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ums_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ums -d ums"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ums
      DB_USERNAME: ums
      DB_PASSWORD: ${DB_PASSWORD:-ums_password}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
