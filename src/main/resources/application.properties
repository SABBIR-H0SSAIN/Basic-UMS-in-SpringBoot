spring.application.name=ums_assignment
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ums}
spring.datasource.username=${DB_USERNAME:ums}
spring.datasource.password=${DB_PASSWORD:ums_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.docker.compose.enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
