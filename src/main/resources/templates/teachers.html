<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teachers - University Management System</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/common.js" defer></script>
    <script src="/management.js" defer></script>
</head>
<body data-resource="teachers">
    <h1>Teachers Management</h1>
    <nav id="navigation" aria-label="Main navigation"></nav>
    <p id="message" role="status" aria-live="polite"></p>
    <main id="management" hidden>
        <h2 id="form-heading">Add record</h2>
        <form id="account-form">
            <p><label for="username">Username</label>
                <input id="username" name="username" required></p>
            <p><label for="name">Name</label>
                <input id="name" name="name" required></p>
            <p><label for="email">Email</label>
                <input id="email" name="email" type="email" required></p>
            <p><label for="department">Department</label>
                <input id="department" name="department" maxlength="100" required></p>
            <p><label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" required></p>
            <p>When editing, enter a password to save with the updated record.</p>
            <button id="save-button" type="submit">Add</button>
            <button id="cancel-button" type="button" hidden>Cancel edit</button>
        </form>
        <h2>Records</h2>
        <div class="table-container">
            <table>
                <thead><tr><th scope="col">ID</th><th scope="col">Username</th>
                    <th scope="col">Name</th><th scope="col">Email</th><th scope="col">Department</th>
                    <th scope="col">Actions</th></tr></thead>
                <tbody id="records"></tbody>
            </table>
        </div>
    </main>
</body>
</html>
