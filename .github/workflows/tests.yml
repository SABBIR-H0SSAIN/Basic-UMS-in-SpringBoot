name: Tests

on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw -B -ntp verify
